version: '3.8'

services:

  # 1. PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: gridsense_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m

  # 2. MongoDB 7
  mongodb:
    image: mongo:7
    container_name: gridsense_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    mem_limit: 512m

  # 3. Neo4j 5 (Community)
  neo4j:
    image: neo4j:5-community
    container_name: gridsense_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    mem_limit: 1g

  # 4. Redis 7
  redis:
    image: redis:7-alpine
    container_name: gridsense_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 256m

  # 5. Apache Cassandra 4.1
  cassandra:
    image: cassandra:4.1
    container_name: gridsense_cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    mem_limit: 2g # Cassandra needs more memory

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
  redis_data:
  cassandra_data: